<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 320px;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 12px;
      background-color: #f8f9fa;
      color: #333;
    }
    h3 {
      margin-top: 0;
      font-size: 16px;
      color: #2c3e50;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .badge {
      background-color: #e74c3c;
      color: white;
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 12px;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
      max-height: 250px;
      overflow-y: auto;
    }
    li {
      background: white;
      border: 1px solid #e0e0e0;
      border-left: 4px solid #e74c3c;
      padding: 8px;
      margin-bottom: 8px;
      border-radius: 4px;
      font-size: 12px;
    }
    .type {
      font-weight: bold;
      color: #c0392b;
    }
    .time {
      font-size: 10px;
      color: #7f8c8d;
      margin-top: 2px;
    }
    .empty {
      text-align: center;
      color: #95a5a6;
      font-size: 12px;
      padding: 20px 0;
    }
    button {
      width: 100%;
      padding: 6px;
      background-color: #95a5a6;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 8px;
      font-size: 12px;
    }
    button:hover {
      background-color: #7f8c8d;
    }
  </style>
</head>
<body>
  <h3>Riwayat Pelanggaran <span id="count" class="badge">0</span></h3>
  <ul id="log-list">
    <li class="empty">Belum ada pelanggaran terdeteksi.</li>
  </ul>
  <button id="clear-btn">Hapus Riwayat Lokal</button>

  <script src="popup.js"></script>
</body>
</html>
