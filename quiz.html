<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujian Essay Terproteksi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; user-select: none; -webkit-user-select: none; }
    .card-custom { max-width: 750px; margin: 30px auto; border-radius: 12px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .no-copy-input { resize: none; }
  </style>
</head>
<body>

  <!-- Modal Login Peserta -->
  <div class="modal fade" id="loginModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold">Login Peserta Ujian</h5>
        </div>
        <div class="modal-body">
          <form id="login-form">
            <div class="mb-3">
              <label class="form-label fw-bold">Nama Lengkap Mahasiswa</label>
              <input type="text" id="input-nama" class="form-control" placeholder="Contoh: Henri Tantyoko" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">NIM (Nomor Induk Mahasiswa)</label>
              <input type="text" id="input-nim" class="form-control" placeholder="Contoh: 1231241412" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Mulai Ujian</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Area Ujian -->
  <div class="container d-none" id="quiz-container">
    <div class="card card-custom p-4">
      <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
        <div>
          <h5 class="fw-bold m-0" id="display-user">Mahasiswa: -</h5>
          <small class="text-muted" id="display-nim">NIM: -</small>
        </div>
        <span class="badge bg-danger fs-6" id="violation-badge">Pelanggaran: 0 / 3</span>
      </div>

      <div class="alert alert-warning py-2 small fw-bold">
        ⚠️ PERINGATAN: Dilarang Copy-Paste, pindah tab, atau keluar dari layar penuh!
      </div>

      <form id="essay-form">
        <div class="mb-4">
          <label class="fw-bold mb-2">1. Jelaskan arsitektur middleware pada Express.js!</label>
          <textarea name="essay_1" class="form-control no-copy-input" rows="4" placeholder="Ketik jawaban essay Anda..." required></textarea>
        </div>

        <div class="mb-4">
          <label class="fw-bold mb-2">2. Mengapa proteksi kuis berbasis website lebih efektif dibandingkan Chrome Extension?</label>
          <textarea name="essay_2" class="form-control no-copy-input" rows="4" placeholder="Ketik jawaban essay Anda..." required></textarea>
        </div>

        <button type="submit" id="btn-submit" class="btn btn-success w-100 fw-bold">Kirim Jawaban Essay</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_VIOLATION_URL = 'https://quiz-tracker-seven.vercel.app/v1/violations';
    const API_SUBMIT_URL = 'https://quiz-tracker-seven.vercel.app/v1/quiz/submit';

    let userNama = '', userNim = '';
    let isLoggedIn = false; // FLAG: Proctoring mati sampai login berhasil
    const MAX_VIOLATIONS = 3;
    let violationCount = 0;
    let isSubmitted = false;

    const loginModal = new bootstrap.Modal(document.getElementById('loginModal'));
    window.addEventListener('DOMContentLoaded', () => loginModal.show());

    // --- PROSES LOGIN ---
    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      userNama = document.getElementById('input-nama').value.trim();
      userNim = document.getElementById('input-nim').value.trim();

      if (!userNama || !userNim) {
        alert('Nama dan NIM wajib diisi!');
        return;
      }

      document.getElementById('display-user').textContent = `Mahasiswa: ${userNama}`;
      document.getElementById('display-nim').textContent = `NIM: ${userNim}`;

      loginModal.hide();
      document.getElementById('quiz-container').classList.remove('d-none');
      
      // Mengaktifkan Status Login & Proctoring
      isLoggedIn = true;

      // Minta Layar Penuh
      if (document.documentElement.requestFullscreen) {
        document.documentElement.requestFullscreen().catch(() => {});
      }
    });

    // --- LOGIKA PELANGGARAN (HANYA JIKA SUDAH LOGIN & BELUM SUBMIT) ---
    async function sendViolationLog(type, detail) {
      if (!isLoggedIn || isSubmitted) return; // Abaikan jika belum login atau sudah submit

      violationCount++;
      document.getElementById('violation-badge').textContent = `Pelanggaran: ${violationCount} / ${MAX_VIOLATIONS}`;
      alert(`⚠️ PELANGGARAN TERDETEKSI (${violationCount}/${MAX_VIOLATIONS}): ${detail}`);

      try {
        await fetch(API_VIOLATION_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: userNama,
            quizId: 'ESSAY_WEB_DEV',
            type: type,
            detail: `[NIM: ${userNim}] ${detail}`,
            url: window.location.href
          })
        });
      } catch (err) {}

      if (violationCount >= MAX_VIOLATIONS) {
        autoSubmitQuiz();
      }
    }

    function autoSubmitQuiz() {
      if (!isLoggedIn || isSubmitted) return;
      isSubmitted = true;
      disableForm();
      alert('Pelanggaran mencapai batas maksimal! Ujian dihentikan dan jawaban dikirim otomatis.');
      submitData('DISQUALIFIED');
    }

    function disableForm() {
      const elements = document.getElementById('essay-form').elements;
      for (let i = 0; i < elements.length; i++) {
        elements[i].disabled = true;
      }
    }

    async function submitData(status = 'COMPLETED') {
      const formData = new FormData(document.getElementById('essay-form'));
      const answers = {
        essay_1: formData.get('essay_1') || '',
        essay_2: formData.get('essay_2') || ''
      };

      try {
        await fetch(API_SUBMIT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            userId: userNama,
            nim: userNim,
            quizId: 'ESSAY_WEB_DEV',
            answers: answers,
            status: status
          })
        });

        alert('Ujian Selesai! Terima kasih.');
        window.location.href = 'about:blank';
      } catch (err) {
        alert('Gagal mengirim jawaban: ' + err.message);
      }
    }

    // --- PROTEKSI ESSAY ---
    document.querySelectorAll('.no-copy-input').forEach(el => {
      el.addEventListener('paste', (e) => { 
        e.preventDefault(); 
        if (isLoggedIn && !isSubmitted) sendViolationLog('PASTE_ESSAY', 'Mencoba menempelkan teks.'); 
      });
      el.addEventListener('copy', (e) => { 
        e.preventDefault(); 
        if (isLoggedIn && !isSubmitted) sendViolationLog('COPY_ESSAY', 'Mencoba menyalin teks.'); 
      });
      el.addEventListener('cut', (e) => e.preventDefault());
    });

    document.getElementById('essay-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (!isLoggedIn || isSubmitted) return;
      isSubmitted = true;
      disableForm();
      submitData('SUBMITTED_MANUALLY');
    });

    // Listener Pindah Tab & Layar (Cek status isLoggedIn)
    window.addEventListener('blur', () => {
      if (isLoggedIn && !isSubmitted) sendViolationLog('BLUR_WINDOW', 'Fokus layar ujian hilang.');
    });

    document.addEventListener('visibilitychange', () => {
      if (document.hidden && isLoggedIn && !isSubmitted) sendViolationLog('PINDAH_TAB', 'Berpindah tab browser.');
    });
  </script>
</body>
</html>
