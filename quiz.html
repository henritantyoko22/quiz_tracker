<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ujian Essay Terproteksi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; user-select: none; -webkit-user-select: none; }
    .card-custom { max-width: 750px; margin: 30px auto; border-radius: 12px; border: none; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    .no-copy-input { resize: none; }
  </style>
</head>
<body>

  <!-- 1. MODAL LOGIN MAHASISWA -->
  <div class="modal fade" id="loginModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title fw-bold">Login Peserta Ujian</h5>
        </div>
        <div class="modal-body">
          <form id="login-form">
            <div class="mb-3">
              <label class="form-label fw-bold">Nama Lengkap Mahasiswa</label>
              <input type="text" id="input-nama" class="form-control" placeholder="Contoh: Budi Santoso" required>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">NIM (Nomor Induk Mahasiswa)</label>
              <input type="text" id="input-nim" class="form-control" placeholder="Contoh: 24060120140001" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold">Mulai Ujian</button>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. AREA HALAMAN UJIAN -->
  <div class="container d-none" id="quiz-container">
    <div class="card card-custom p-4">
      <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
        <div>
          <h5 class="fw-bold m-0" id="display-user">Mahasiswa: -</h5>
          <small class="text-muted" id="display-nim">NIM: -</small>
        </div>
        <span class="badge bg-danger fs-6" id="violation-badge">Pelanggaran: 0 / 3</span>
      </div>

      <div class="alert alert-warning py-2 small fw-bold">
        ⚠️ PERINGATAN: Dilarang Copy-Paste, memindahkan tab, atau keluar dari fullscreen!
      </div>

      <form id="essay-form">
        <div class="mb-4">
          <label class="fw-bold mb-2">1. Jelaskan bagaimana arsitektur Express.js mengelola middleware dan routing HTTP!</label>
          <textarea name="essay_1" class="form-control no-copy-input" rows="4" placeholder="Ketik jawaban essay Anda di sini..." required></textarea>
        </div>

        <div class="mb-4">
          <label class="fw-bold mb-2">2. Mengapa proteksi sisi kuis berbasis website lebih aman dibandingkan hanya mengandalkan Chrome Extension?</label>
          <textarea name="essay_2" class="form-control no-copy-input" rows="4" placeholder="Ketik jawaban essay Anda di sini..." required></textarea>
        </div>

        <button type="submit" class="btn btn-success w-100 fw-bold">Kirim Jawaban Essay</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    const API_VIOLATION_URL = 'https://quiz-tracker-seven.vercel.app/v1/violations';
    const API_SUBMIT_URL = 'https://quiz-tracker-seven.vercel.app/v1/quiz/submit';

    let userNama = '', userNim = '';
    const MAX_VIOLATIONS = 3;
    let violationCount = 0;
    let isSubmitted = false;

    // Tampilkan Modal Login Pertama Kali
    const loginModal = new bootstrap.Modal(document.getElementById('loginModal'));
    window.addEventListener('DOMContentLoaded', () => loginModal.show());

    document.getElementById('login-form').addEventListener('submit', (e) => {
      e.preventDefault();
      userNama = document.getElementById('input-nama').value;
      userNim = document.getElementById('input-nim').value;

      document.getElementById('display-user').textContent = `Mahasiswa: ${userNama}`;
      document.getElementById('display-nim').textContent = `NIM: ${userNim}`;

      loginModal.hide();
      document.getElementById('quiz-container').classList.remove('d-none');
      document.documentElement.requestFullscreen().catch(() => {});
    });

    // --- PROTEKSI COPY-PASTE KHUSUS TEXTAREA ESSAY ---
    document.querySelectorAll('.no-copy-input').forEach(textarea => {
      // Blokir Paste
      textarea.addEventListener('paste', (e) => {
        e.preventDefault();
        sendViolationLog('PASTE_ESSAY', 'Mencoba menempelkan (paste) teks ke dalam jawaban essay.');
      });
      // Blokir Copy / Cut
      textarea.addEventListener('copy', (e) => {
        e.preventDefault();
        sendViolationLog('COPY_ESSAY', 'Mencoba menyalin (copy) teks dari jawaban essay.');
      });
      textarea.addEventListener('cut', (e) => e.preventDefault());
    });

    async function loadQuestions(quizId) {
    try {
        const res = await fetch(`https://quiz-tracker-seven.vercel.app/v1/quiz/questions/${quizId}`);
        const result = await res.json();
        
        if (result.status === 'success') {
        const container = document.getElementById('essay-form');
        // Render elemen textarea untuk setiap soal essay secara dinamis
        }
    } catch (err) {
        console.error('Gagal memuat soal:', err);
    }
    }

    async function sendViolationLog(type, detail) {
      if (isSubmitted) return;

      violationCount++;
      document.getElementById('violation-badge').textContent = `Pelanggaran: ${violationCount} / ${MAX_VIOLATIONS}`;
      alert(`⚠️ PELANGGARAN TERDETEKSI: ${detail}`);

      await fetch(API_VIOLATION_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId: userNama,
          quizId: 'ESSAY_WEB_DEV',
          type: type,
          detail: `[NIM: ${userNim}] ${detail}`,
          timestamp: new Date().toISOString(),
          url: window.location.href
        })
      });

      if (violationCount >= MAX_VIOLATIONS) {
        autoSubmitQuiz();
      }
    }

    function autoSubmitQuiz() {
      if (isSubmitted) return;
      isSubmitted = true;
      alert('Pelanggaran mencapai batas maksimal! Jawaban Anda disubmit otomatis.');
      submitData('DISQUALIFIED');
    }

    async function submitData(status = 'COMPLETED') {
      const formData = new FormData(document.getElementById('essay-form'));
      const answers = {
        essay_1: formData.get('essay_1'),
        essay_2: formData.get('essay_2')
      };

      await fetch(API_SUBMIT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          userId: userNama,
          nim: userNim,
          quizId: 'ESSAY_WEB_DEV',
          answers: answers,
          status: status
        })
      });

      alert('Ujian Selesai! Terima kasih.');
      window.location.reload();
    }

    document.getElementById('essay-form').addEventListener('submit', (e) => {
      e.preventDefault();
      if (isSubmitted) return;
      isSubmitted = true;
      submitData('SUBMITTED_MANUALLY');
    });

    // Event Listener Pindah Tab / Screen Blur
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && !isSubmitted) sendViolationLog('PINDAH_TAB', 'Terdeteksi berpindah tab browser.');
    });
    window.addEventListener('blur', () => {
      if (!isSubmitted) sendViolationLog('BLUR_WINDOW', 'Fokus jendela ujian hilang.');
    });
  </script>
</body>
</html>
