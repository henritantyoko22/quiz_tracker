<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - Impor Soal Kuis</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="p-4 bg-light">

  <div class="container" style="max-width: 800px;">
    <h3 class="fw-bold mb-4">Panel Admin: Impor Soal Ujian</h3>

    <div class="card p-4 shadow-sm mb-4">
      <h5 class="fw-bold">1. Impor Soal via Format JSON</h5>
      <p class="text-muted small">Format JSON harus berisi array objek soal essay.</p>
      
      <div class="mb-3">
        <label class="form-label">ID Kuis / Ujian</label>
        <input type="text" id="admin-quiz-id" class="form-control" value="ESSAY_PEMROGRAMAN">
      </div>

      <div class="mb-3">
        <label class="form-label">Data JSON Soal</label>
        <textarea id="json-input" class="form-control" rows="6" placeholder='[
  { "id": 1, "question": "Jelaskan konsep dasar Event Loop pada Node.js!" },
  { "id": 2, "question": "Apa fungsi middleware pada Express.js?" }
]'></textarea>
      </div>

      <button id="btn-import-json" class="btn btn-primary fw-bold">🚀 Upload & Impor Soal</button>
    </div>
  </div>

  <script>
    document.getElementById('btn-import-json').addEventListener('click', async () => {
      const quizId = document.getElementById('admin-quiz-id').value;
      const jsonRaw = document.getElementById('json-input').value;

      try {
        const questions = JSON.parse(jsonRaw);
        const res = await fetch('https://quiz-tracker-seven.vercel.app/v1/admin/questions/import', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ quizId, questions })
        });
        const data = await res.json();
        alert(data.message || 'Impor soal berhasil!');
      } catch (err) {
        alert('Gagal impor soal! Pastikan format JSON sudah benar.');
      }
    });
  </script>
</body>
</html>
